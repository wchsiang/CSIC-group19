<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會議內容收集 · CSIC Group 19</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<body>
<header><strong>會議筆記</strong><span>CSIC · GROUP 19</span></header>
<main>
  <aside><div class="aside-heading"><h2>已儲存的會議</h2><button id="refresh" type="button">重新整理</button></div>
    <button id="new" class="primary" type="button">建立新會議</button>
    <p id="list-status" role="status"></p><nav id="meetings" aria-label="選擇會議"></nav>
  </aside>
  <section>
    <p class="eyebrow">讓討論留下完整脈絡</p>
    <h1>先記下內容，再一起整理。</h1>
    <p class="intro">貼上逐字稿或文字討論紀錄，儲存這次會議的原始內容。</p>
    <form id="form">
      <div id="draft-banner" hidden><p>此瀏覽器有一份尚未完成的草稿。</p><button id="restore" type="button">恢復草稿</button> <button id="discard" type="button">清除草稿</button></div>
      <label for="title">會議標題</label>
      <input id="title" name="title" required maxlength="120" placeholder="例如：CP2 功能分工討論" autocomplete="off">
      <label for="import-file" class="import-label">匯入文字逐字稿（UTF-8 .txt）</label>
      <input id="import-file" type="file" accept=".txt,text/plain" aria-describedby="import-hint">
      <p id="import-hint" class="hint">僅帶入內容，仍需按儲存；若已有文字，匯入前會先確認。</p>
      <div class="transcript-heading"><label for="transcript">會議內容</label><span id="count">0 / 100,000 字</span></div>
      <textarea id="transcript" name="transcript" required maxlength="100000" rows="15" placeholder="在這裡貼上討論內容。可以保留發言者名稱與時間，方便後續確認。"></textarea>
      <p class="hint">儲存後可從左側重新開啟。此步驟保存原文，尚未產生 AI 摘要。</p>
      <label class="draft-option"><input id="keep-draft" type="checkbox"> 在此瀏覽器保留未儲存草稿</label>
      <p class="hint">草稿會留在這台裝置，供意外關閉後復原；不會自動送出。共用電腦使用完畢請清除草稿。</p>
      <div class="actions"><button id="save" class="primary" type="submit">儲存會議</button><span id="status" role="status" aria-live="polite"></span></div>
      <p id="metadata" class="hint"></p>
    </form>
  </section>
</main>
</body>
</html>
